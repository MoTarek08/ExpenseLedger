services:
  app-db:
    image: postgres:18.1
    container_name: app-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
        "CMD","sh","-c",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1;'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  minio:
    image: "minio/minio:RELEASE.2025-04-22T22-12-26Z"
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: [ "server", "--console-address", ":9001", "/data" ]

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  hangfire-db:
    image: postgres:18.1
    container_name: hangfire-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${HANGFIRE_POSTGRES_DB}
      - POSTGRES_USER=${HANGFIRE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${HANGFIRE_POSTGRES_PASSWORD}

    healthcheck:
      test:     
        [
        "CMD","sh","-c",
        "pg_isready -U ${HANGFIRE_POSTGRES_USER} && psql -U ${HANGFIRE_POSTGRES_USER} -d ${HANGFIRE_POSTGRES_DB} -c 'SELECT 1;'",
        ]  
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped


  api:
    image: ${IMAGE_TAG}
    container_name: api
    ports:
      - "7000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DbSettings__ConnectionString=Host=app-db; Port=5432; Database=${POSTGRES_DB}; Username=${POSTGRES_USER}; Password=${POSTGRES_PASSWORD}; Search Path=public; TrustServerCertificate=True
      - HangfireDbSettings__ConnectionString=Host=hangfire-db; Port=5432; Database=${HANGFIRE_POSTGRES_DB}; Username=${HANGFIRE_POSTGRES_USER}; Password=${HANGFIRE_POSTGRES_PASSWORD}; Search Path=public; TrustServerCertificate=True
      - ObjectStorageSettings__Endpoint=minio:9000
      - ObjectStorageSettings__AccessKey=${MINIO_ROOT_USER}
      - ObjectStorageSettings__SecretKey=${MINIO_ROOT_PASSWORD}
      - AccessTokenSettings__SigningKey=${ACCESS_TOKEN_SIGNING_KEY}
    depends_on:
      app-db:
        condition: service_healthy
      hangfire-db:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped


