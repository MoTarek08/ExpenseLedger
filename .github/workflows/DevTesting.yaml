name: Test dev branch with source-tests & container tests

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**.[mM][dD]"
      - "Docs/**"
      - "Server/Logs/**"
      - "Server/TestResults/**"
    types:
      - opened
      - reopened
      - synchronize

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/SetupAndRunTests.yaml

  docker-build-and-smoke-tests:
    name: Docker build and smoke tests
    needs: tests
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: api:${{ github.sha }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      HANGFIRE_POSTGRES_DB: ${{ secrets.HANGFIRE_POSTGRES_DB }}
      HANGFIRE_POSTGRES_USER: ${{ secrets.HANGFIRE_POSTGRES_USER }}
      HANGFIRE_POSTGRES_PASSWORD: ${{ secrets.HANGFIRE_POSTGRES_PASSWORD }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      ACCESS_TOKEN_SIGNING_KEY: ${{ secrets.ACCESS_TOKEN_SIGNING_KEY }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        id: build
        run: |
          docker build \
            --file Server/Dockerfile \
            --tag "$IMAGE_TAG" \
            Server/

      - name: Validate compose config
        run: docker compose -f .github/docker-compose.ci.yaml config --quiet

      - name: Start application
        run: |
            docker compose \
            -f .github/docker-compose.ci.yaml \
            up -d

      - name: Wait for application
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:7000/; then
              echo "Application responded successfully"
              exit 0
            fi

            sleep 2
          done

          echo "Application failed to respond"
          docker compose -f .github/docker-compose.ci.yaml logs
          exit 1

      - name: Shutdown
        if: always()
        run: |
          docker compose \
            -f .github/docker-compose.ci.yaml \
            down -v



